[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-code"
dynamic = ["version"]
description = "Agentic coding CLI for any local model served by Ollama or an OpenAI-compatible server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicolas Barbosa" }]
keywords = ["cli", "agent", "coding-assistant", "ollama", "llm", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28",
    "rich>=13.0",
    "pyyaml>=6.0",
    "textual>=0.80.0",
]

[project.urls]
Homepage = "https://github.com/nikotpab/local-code"
Repository = "https://github.com/nikotpab/local-code"
Changelog = "https://github.com/nikotpab/local-code/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
local-code = "local_code.cli:main"

[tool.hatch.version]
path = "local_code/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["local_code"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 line-too-long: many descriptive strings/prompts run long on purpose.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests: allow assert-related idioms, unused locals (fixtures/context vars),
# and module docstrings placed after `from __future__` imports.
"tests/*" = ["B011", "F841", "E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
# Pragmatic starting point: no strict typing gate yet, just catch obvious slips.
check_untyped_defs = false
files = ["local_code"]

# The TUI is tightly bound to Textual's dynamically-typed message/handler
# protocol (sync overrides of async handlers, etc.); type-checking it fights
# the framework more than it catches real bugs.
[[tool.mypy.overrides]]
module = "local_code.tui.*"
ignore_errors = true
